# Publishes provider release assets when a version tag is pushed.
# Requires secret GPG_PRIVATE_KEY. PASSPHRASE is optional (omit for passphrase-less keys).
name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Detect GPG passphrase
        id: gpg_pass
        env:
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: |
          if [ -n "${PASSPHRASE}" ]; then
            echo "has_passphrase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_passphrase=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG key
        if: steps.gpg_pass.outputs.has_passphrase == 'false'
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg_nopw
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Import GPG key (with passphrase)
        if: steps.gpg_pass.outputs.has_passphrase == 'true'
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        id: import_gpg_pw
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Set GPG fingerprint
        id: import_gpg
        run: |
          fp="${{ steps.import_gpg_nopw.outputs.fingerprint }}${{ steps.import_gpg_pw.outputs.fingerprint }}"
          if [ -z "$fp" ]; then
            echo "GPG fingerprint missing; ensure GPG_PRIVATE_KEY is set" >&2
            exit 1
          fi
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          # .goreleaser.yml uses version: 2; require goreleaser v2.x
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
